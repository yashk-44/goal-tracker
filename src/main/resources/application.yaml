spring:
  application:
    name: goal-tracker

  # DB information
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PSWD}

  # Hibernate ORM configs
  jpa: # Jakarta Persistence API (used for ORM handling)
    hibernate:  # Hiberante ORM configs
      ddl-auto: update  # Automatically update the DB based on my DDL
    show-sql: true  # Show the SQL commands being used
    properties:  # properties for the JPA I want
      hibernate:  # Proprties for the hibernate ORM
        format_sql: true  # Format the displayed SQL into a readable output
