name: Test Goal
run-name: ${{github.actor}} is running the goal tests
on:
  pull_request: 
    branches: [main]
  push:
    branches: [main]
    
jobs:
  tests:
    runs-on: ubuntu-latest
  
    steps:
      - name: Start build
        run: echo "${{github.actor}} has made a PR"

      - name: Checkout code
        uses: actions/checkout@v5    

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      
      - run: ./mvnw clean test
      
  docker-build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker:${GITHUB_SHA::7} .

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker:${GITHUB_SHA::7}
  

